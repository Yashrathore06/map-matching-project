<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live GPS Tracking</title>
</head>

<body>

    <h1>Live GPS Tracking</h1>

    <button onclick="startTracking()">Start GPS Tracking</button>
    <button onclick="stopTracking()">Stop Tracking</button>

    <p id="status">GPS not started</p>

    <p>Latitude: <span id="latitude">-</span></p>
    <p>Longitude: <span id="longitude">-</span></p>
    <p>Speed: <span id="speed">-</span></p>

    <script>

        let watchId = null;

        // FastAPI backend
        const BACKEND_URL = "https://map-matching-project.onrender.com/";


        function startTracking() {

            if (!navigator.geolocation) {
                document.getElementById("status").innerText =
                    "Geolocation is not supported.";
                return;
            }

            document.getElementById("status").innerText =
                "Tracking started...";

            watchId = navigator.geolocation.watchPosition(

                async function(position) {

                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    let speed = position.coords.speed;

                    if (speed !== null) {
                        speed = speed * 3.6;
                    }

                    document.getElementById("latitude").innerText =
                        latitude.toFixed(6);

                    document.getElementById("longitude").innerText =
                        longitude.toFixed(6);

                    document.getElementById("speed").innerText =
                        speed !== null
                            ? speed.toFixed(2) + " km/h"
                            : "Not available";


                    // Send GPS data to FastAPI
                    try {

                        const response = await fetch(BACKEND_URL, {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                latitude: latitude,
                                longitude: longitude,
                                speed: speed
                            })
                        });

                        const result = await response.json();

                        console.log("Backend:", result);

                        document.getElementById("status").innerText =
                            "GPS sent to backend successfully";

                    } catch (error) {

                        console.error(error);

                        document.getElementById("status").innerText =
                            "GPS received, but backend connection failed";
                    }
                },


                function(error) {

                    document.getElementById("status").innerText =
                        "GPS Error: " + error.message;
                },


                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }


        function stopTracking() {

            if (watchId !== null) {

                navigator.geolocation.clearWatch(watchId);

                watchId = null;
            }

            document.getElementById("status").innerText =
                "GPS tracking stopped";
        }

    </script>

</body>
</html>
