<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Map Matching System</title>


    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }


        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }


        header h1 {
            margin: 0 0 8px 0;
            font-size: 26px;
        }


        header p {
            margin: 0;
            font-size: 14px;
        }


        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }


        .status-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);
        }


        .status-row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }


        .status-item {
            font-weight: bold;
        }


        .online {
            color: green;
        }


        .offline {
            color: red;
        }


        .buttons {
            margin-top: 15px;
        }


        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 8px;
            font-size: 14px;
        }


        #startBtn {
            background: #2563eb;
            color: white;
        }


        #stopBtn {
            background: #dc2626;
            color: white;
        }


        .dashboard {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(200px, 1fr)
                );

            gap: 15px;
            margin-bottom: 15px;
        }


        .card {
            background: white;
            padding: 18px;
            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);
        }


        .card-title {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }


        .card-value {
            font-size: 20px;
            font-weight: bold;
        }


        .road-result {
            font-size: 24px;
            font-weight: bold;
            text-transform: capitalize;
        }


        #map {
            height: 500px;
            width: 100%;
            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.1);
        }


        .info {
            margin-top: 15px;
            background: white;
            padding: 15px;
            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);
        }


        .info h3 {
            margin-top: 0;
        }


        .info p {
            margin: 10px 0;
        }


        @media (max-width: 600px) {

            header h1 {
                font-size: 21px;
            }


            #map {
                height: 400px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        AI-Based Map Matching System
    </h1>

    <p>
        Highway / Service Road / Local Road Detection
    </p>

</header>



<div class="container">


    <!-- ==========================================
         CONNECTION STATUS
    =========================================== -->

    <div class="status-card">

        <div class="status-row">

            <div class="status-item">

                Backend:

                <span id="backendStatus">
                    Checking...
                </span>

            </div>


            <div class="status-item">

                GPS:

                <span id="gpsStatus">
                    Not Started
                </span>

            </div>

        </div>


        <div class="buttons">

            <button
                id="startBtn"
                onclick="startTracking()"
            >
                Start GPS Tracking
            </button>


            <button
                id="stopBtn"
                onclick="stopTracking()"
            >
                Stop Tracking
            </button>

        </div>

    </div>



    <!-- ==========================================
         GPS DASHBOARD
    =========================================== -->

    <div class="dashboard">


        <!-- Latitude -->

        <div class="card">

            <div class="card-title">
                Latitude
            </div>

            <div
                class="card-value"
                id="latitude"
            >
                -
            </div>

        </div>



        <!-- Longitude -->

        <div class="card">

            <div class="card-title">
                Longitude
            </div>

            <div
                class="card-value"
                id="longitude"
            >
                -
            </div>

        </div>



        <!-- Speed -->

        <div class="card">

            <div class="card-title">
                Speed
            </div>

            <div
                class="card-value"
                id="speed"
            >
                -
            </div>

        </div>



        <!-- Road Type -->

        <div class="card">

            <div class="card-title">
                Road Type
            </div>

            <div
                class="road-result"
                id="roadType"
            >
                Waiting...
            </div>

        </div>



        <!-- ML Confidence -->

        <div class="card">

            <div class="card-title">
                ML Confidence
            </div>

            <div
                class="card-value"
                id="confidence"
            >
                -
            </div>

        </div>


    </div>



    <!-- ==========================================
         MAP
    =========================================== -->

    <div id="map"></div>



    <!-- ==========================================
         ROAD INFORMATION
    =========================================== -->

    <div class="info">

        <h3>
            Road Information
        </h3>


        <p>

            <b>
                Road Name:
            </b>

            <span id="roadName">
                -
            </span>

        </p>


        <p>

            <b>
                OSM Highway Class:
            </b>

            <span id="highwayClass">
                -
            </span>

        </p>


        <p>

            <b>
                Distance from Road:
            </b>

            <span id="roadDistance">
                -
            </span>

        </p>


        <p>

            <b>
                Last Update:
            </b>

            <span id="lastUpdate">
                -
            </span>

        </p>

    </div>


</div>



<!-- ==========================================
     LEAFLET JS
=========================================== -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>



<script>


// ==================================================
// BACKEND
// ==================================================

const BACKEND_BASE_URL =
    "https://map-matching-project.onrender.com";


const BACKEND_URL =
    BACKEND_BASE_URL + "/gps";



// ==================================================
// MAP
// ==================================================

const map =
    L.map("map").setView(
        [20.5937, 78.9629],
        5
    );


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);



let marker = null;

let watchId = null;

let isSending = false;

let lastSentTime = 0;



// ==================================================
// BACKEND STATUS
// ==================================================

async function checkBackend() {

    const statusElement =
        document.getElementById(
            "backendStatus"
        );


    try {

        const response =
            await fetch(
                BACKEND_BASE_URL +
                "/health"
            );


        if (!response.ok) {

            throw new Error(
                "Backend unavailable"
            );

        }


        statusElement.innerText =
            "Connected";

        statusElement.className =
            "online";

    }


    catch (error) {

        console.error(
            "Backend health error:",
            error
        );


        statusElement.innerText =
            "Disconnected";

        statusElement.className =
            "offline";

    }

}



// ==================================================
// START GPS TRACKING
// ==================================================

function startTracking() {


    if (!navigator.geolocation) {

        alert(
            "Geolocation is not supported by this browser."
        );

        return;

    }


    if (watchId !== null) {

        return;

    }


    document.getElementById(
        "gpsStatus"
    ).innerText =
        "Starting...";


    watchId =
        navigator.geolocation.watchPosition(

            handlePosition,

            handleGPSError,

            {

                enableHighAccuracy: true,

                timeout: 10000,

                maximumAge: 0

            }

        );

}



// ==================================================
// HANDLE GPS POSITION
// ==================================================

async function handlePosition(
    position
) {


    // ----------------------------------------------
    // Get GPS coordinates
    // ----------------------------------------------

    const latitude =
        position.coords.latitude;


    const longitude =
        position.coords.longitude;


    let speed =
        position.coords.speed;



    // ----------------------------------------------
    // Convert m/s to km/h
    // ----------------------------------------------

    if (speed !== null) {

        speed =
            speed * 3.6;

    }



    // ----------------------------------------------
    // Display GPS data
    // ----------------------------------------------

    document.getElementById(
        "latitude"
    ).innerText =
        latitude.toFixed(6);


    document.getElementById(
        "longitude"
    ).innerText =
        longitude.toFixed(6);


    document.getElementById(
        "speed"
    ).innerText =

        speed !== null

            ? speed.toFixed(2) +
              " km/h"

            : "Not available";


    document.getElementById(
        "gpsStatus"
    ).innerText =
        "Active";



    // ==================================================
    // UPDATE MAP MARKER
    // ==================================================

    const currentPosition = [

        latitude,

        longitude

    ];


    if (marker === null) {


        marker =
            L.marker(
                currentPosition
            ).addTo(map);


        map.setView(
            currentPosition,
            17
        );

    }


    else {


        marker.setLatLng(
            currentPosition
        );


        map.panTo(
            currentPosition
        );

    }



    // ==================================================
    // AVOID TOO MANY API REQUESTS
    // ==================================================

    const now =
        Date.now();


    if (

        isSending ||

        now - lastSentTime < 4000

    ) {

        return;

    }


    lastSentTime =
        now;


    isSending =
        true;



    // ==================================================
    // SEND GPS TO BACKEND
    // ==================================================

    try {


        console.log(
            "================================"
        );


        console.log(
            "Sending GPS to backend..."
        );


        console.log(
            "Latitude:",
            latitude
        );


        console.log(
            "Longitude:",
            longitude
        );


        console.log(
            "Speed:",
            speed
        );



        const response =
            await fetch(

                BACKEND_URL,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },


                    body:
                        JSON.stringify({

                            latitude:
                                latitude,

                            longitude:
                                longitude,

                            speed:
                                speed

                        })

                }

            );



        // ------------------------------------------
        // Get backend response
        // ------------------------------------------

        const result =
            await response.json();



        console.log(
            "================================"
        );


        console.log(
            "GPS BACKEND RESPONSE:"
        );


        console.log(
            result
        );


        console.log(
            "HTTP STATUS:",
            response.status
        );


        console.log(
            "================================"
        );



        // ------------------------------------------
        // Check response
        // ------------------------------------------

        if (!response.ok) {

            throw new Error(

                result.detail ||

                "Backend error"

            );

        }



        // ------------------------------------------
        // Update UI
        // ------------------------------------------

        updateRoadInformation(
            result
        );


    }


    catch (error) {


        console.error(
            "GPS Backend Error:",
            error
        );


        document.getElementById(
            "backendStatus"
        ).innerText =
            "GPS API Error";


        document.getElementById(
            "backendStatus"
        ).className =
            "offline";

    }


    finally {

        isSending =
            false;

    }

}



// ==================================================
// FORMAT ROAD TYPE
// ==================================================

function formatRoadType(type) {


    if (!type) {

        return "Unknown";

    }


    const value =
        String(type)
            .toLowerCase()
            .replace(/-/g, "_");


    if (
        value === "highway"
    ) {

        return "Highway";

    }


    if (
        value === "service_road"
    ) {

        return "Service Road";

    }


    if (
        value === "local_road"
    ) {

        return "Local Road";

    }


    return String(type)
        .replace(/_/g, " ")
        .replace(/\b\w/g, function(letter) {

            return letter.toUpperCase();

        });

}



// ==================================================
// UPDATE ROAD INFORMATION
// ==================================================

function updateRoadInformation(
    result
) {


    console.log(
        "Updating road information:",
        result
    );



    // ----------------------------------------------
    // Backend status
    // ----------------------------------------------

    document.getElementById(
        "backendStatus"
    ).innerText =
        "Connected";


    document.getElementById(
        "backendStatus"
    ).className =
        "online";



    // ----------------------------------------------
    // Road Type
    // ----------------------------------------------

    document.getElementById(
        "roadType"
    ).innerText =
        formatRoadType(
            result.final_classification
        );



    // ----------------------------------------------
    // ML Confidence
    // ----------------------------------------------

    const confidence =
        result.final_confidence;


    document.getElementById(
        "confidence"
    ).innerText =

        confidence !== undefined &&
        confidence !== null

            ? (
                confidence * 100
            ).toFixed(1) + "%"

            : "-";



    // ----------------------------------------------
    // Check road information
    // ----------------------------------------------

    if (!result.road) {

        console.warn(
            "No road information received from backend."
        );

        return;

    }



    const road =
        result.road;



    // ----------------------------------------------
    // Road Name
    // ----------------------------------------------

    document.getElementById(
        "roadName"
    ).innerText =
        road.name || "-";



    // ----------------------------------------------
    // OSM Highway Class
    // ----------------------------------------------

    document.getElementById(
        "highwayClass"
    ).innerText =
        road.highway_class || "-";



    // ----------------------------------------------
    // Distance from Road
    // ----------------------------------------------

    document.getElementById(
        "roadDistance"
    ).innerText =

        road.distance !== undefined &&
        road.distance !== null

            ? road.distance + " m"

            : "-";



    // ----------------------------------------------
    // Last Update
    // ----------------------------------------------

    document.getElementById(
        "lastUpdate"
    ).innerText =
        new Date()
            .toLocaleTimeString();

}



// ==================================================
// GPS ERROR
// ==================================================

function handleGPSError(
    error
) {


    document.getElementById(
        "gpsStatus"
    ).innerText =
        "Error";


    console.error(
        "GPS Error:",
        error
    );

}



// ==================================================
// STOP GPS TRACKING
// ==================================================

function stopTracking() {


    if (watchId !== null) {


        navigator.geolocation.clearWatch(
            watchId
        );


        watchId =
            null;

    }


    document.getElementById(
        "gpsStatus"
    ).innerText =
        "Stopped";

}



// ==================================================
// INITIAL BACKEND CHECK
// ==================================================

checkBackend();



setInterval(
    checkBackend,
    30000
);


</script>


</body>

</html>
